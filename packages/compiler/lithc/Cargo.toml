[package]
name = "lithc"
default-run = "lithc"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "lithc — Lithic frontend and fail-closed EVM artifact compiler."

[[bin]]
name = "lithc"
path = "src/main.rs"

[dependencies]
lithic-evm = { path = "../lithic-evm" }
lithic-lithovm = { path = "../lithic-lithovm" }
lithic-syntax = { path = "../lithic-syntax" }
serde_json = "1"

[[bin]]
name = "lithverify"
path = "src/verify.rs"
