[package]
name = "lithic-lithovm"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Fail-closed Lithic compiler backend for native LithoVM bytecode."

[dependencies]
hex = "0.4"
lithic-syntax = { path = "../lithic-syntax" }
lithovm-bytecode = { path = "../../vm/bytecode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"

[dev-dependencies]
lithovm = { path = "../../vm/lithovm" }
