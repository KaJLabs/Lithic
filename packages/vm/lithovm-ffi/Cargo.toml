[package]
name = "lithovm-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lithovm = { path = "../lithovm" }
lithovm-bytecode = { path = "../bytecode" }
lithovm-host = { path = "../lithovm-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
lithic-lithovm = { path = "../../compiler/lithic-lithovm" }
