[package]
name = "lithic-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
hex = "0.4"
serde_json = "1"
libfuzzer-sys = "0.4.13"
lithic-lithovm = { path = "../packages/compiler/lithic-lithovm" }
lithovm = { path = "../packages/vm/lithovm" }
lithovm-bytecode = { path = "../packages/vm/bytecode" }
lithovm-host = { path = "../packages/vm/lithovm-host" }
lithovm-ffi = { path = "../packages/vm/lithovm-ffi" }

[[bin]]
name = "bytecode_decode"
path = "fuzz_targets/bytecode_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compiler_runtime"
path = "fuzz_targets/compiler_runtime.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stateful_maps"
path = "fuzz_targets/stateful_maps.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "synchronous_calls"
path = "fuzz_targets/synchronous_calls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "child_creation"
path = "fuzz_targets/child_creation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "binary_values"
path = "fuzz_targets/binary_values.rs"
test = false
doc = false
bench = false

[[bin]]
name = "account_authorization"
path = "fuzz_targets/account_authorization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_records"
path = "fuzz_targets/ffi_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_receipts"
path = "fuzz_targets/gateway_receipts.rs"
test = false
doc = false
bench = false
