name: Combined compiler and native runtime release candidate

on:
  push:
    tags:
      - "lithic-v*"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" \
              --notes "Combined compiler/native-runtime candidate. Independent rebuild comparison, packaged FFI smoke, source inventory and SBOM are included. Separate release/security acceptance is required before publication."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.96.0 fmt --all -- --check
      - run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.96.0 test --workspace --locked
      - run: python -B -m unittest discover -s scripts/tests -p test_release_toolchain.py
      - name: Build twice, compare binaries and exercise packaged compiler/runtime/verifier
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/release_toolchain.py build \
            --version "$GITHUB_REF_NAME" --target "${{ matrix.target }}" \
            --output "${RUNNER_TEMP}/lithic-release"
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            ${{ runner.temp }}/lithic-release/*.tar.gz
            ${{ runner.temp }}/lithic-release/*.zip
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=("${RUNNER_TEMP}"/lithic-release/*.tar.gz "${RUNNER_TEMP}"/lithic-release/*.zip "${RUNNER_TEMP}"/lithic-release/*.sha256)
          test "${#files[@]}" -eq 2
          gh release upload "$GITHUB_REF_NAME" "${files[@]}"
